openapi: 3.1.0
info:
  title: evolutive-trading engine API
  version: 1.0.0-draft
  description: |
    Simulation service for trading agents. Simulation only; no real money.
    Every JSON response is an envelope { success, data, error, meta }. Field names are snake_case.
    Response times are ISO 8601 timestamps with a time zone; request ranges are plain dates.
    Starting a run queues it and returns 202; progress is followed separately.
servers:
  - url: http://localhost:8000
paths:
  /v1/strategies:
    get:
      summary: Strategies on offer, with their parameters
      responses:
        "200":
          description: Strategies
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StrategiesEnvelope" }
  /v1/market:
    get:
      summary: Intervals and symbols, with the dates available per interval
      responses:
        "200":
          description: Market data the server can simulate on
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarketEnvelope" }
  /v1/runs:
    get:
      summary: Runs, newest first, with each agent's result reduced to its final equity and return
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200":
          description: One page of runs; meta carries the total count and the page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunListEnvelope" }
        "400":
          description: page or limit is out of range; error.code is invalid_parameters
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    post:
      summary: Queue a simulation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RunRequest" }
      responses:
        "202":
          description: Run queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunCreatedEnvelope" }
        "400":
          description: The request is invalid; error.code is invalid_parameters
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /v1/runs/{id}:
    get:
      summary: A run's status, progress, and result once finished
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunEnvelope" }
        "404":
          description: No run with this id; error.code is not_found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /v1/runs/{id}/events:
    get:
      summary: Server-sent events, one per simulated step
      description: |
        `event: step` carries a StepEvent. The stream ends with `event: completed` (data {})
        or `event: failed` (data { message }).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Event stream
          content:
            text/event-stream:
              schema: { $ref: "#/components/schemas/StepEvent" }
        "404":
          description: No run with this id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
components:
  schemas:
    Error:
      type: object
      required: [code, message]
      additionalProperties: false
      properties:
        code: { type: string, examples: [invalid_parameters, not_found] }
        message: { type: string }
    ErrorEnvelope:
      type: object
      required: [success, data, error, meta]
      additionalProperties: false
      properties:
        success: { const: false }
        data: { type: "null" }
        error: { $ref: "#/components/schemas/Error" }
        meta: { type: "null" }
    Parameter:
      type: object
      required: [name, type, default, min, max]
      additionalProperties: false
      properties:
        name: { type: string }
        type: { enum: [integer, number] }
        default: { type: number }
        min: { type: number }
        max: { type: number }
    Strategy:
      type: object
      required: [id, name, description, parameters]
      additionalProperties: false
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        parameters: { type: array, items: { $ref: "#/components/schemas/Parameter" } }
    StrategiesEnvelope:
      type: object
      required: [success, data, error, meta]
      properties:
        success: { const: true }
        data: { type: array, items: { $ref: "#/components/schemas/Strategy" } }
        error: { type: "null" }
        meta: { type: "null" }
    DateRange:
      type: object
      required: [from, to]
      additionalProperties: false
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
    Interval:
      type: object
      required: [id, label, max_range_days]
      additionalProperties: false
      properties:
        id: { type: string, examples: ["1d", "5m"] }
        label: { type: string }
        max_range_days: { type: [integer, "null"] }
    Symbol:
      type: object
      required: [symbol, name, available]
      additionalProperties: false
      properties:
        symbol: { type: string }
        name: { type: string }
        available:
          type: object
          description: Keyed by interval id
          additionalProperties: { $ref: "#/components/schemas/DateRange" }
    Market:
      type: object
      required: [intervals, symbols]
      additionalProperties: false
      properties:
        intervals: { type: array, items: { $ref: "#/components/schemas/Interval" } }
        symbols: { type: array, items: { $ref: "#/components/schemas/Symbol" } }
    MarketEnvelope:
      type: object
      required: [success, data, error, meta]
      properties:
        success: { const: true }
        data: { $ref: "#/components/schemas/Market" }
        error: { type: "null" }
        meta: { type: "null" }
    AgentSpec:
      type: object
      required: [strategy]
      additionalProperties: false
      properties:
        label: { type: string, description: Defaults to the strategy id }
        strategy: { type: string }
        parameters: { type: object, additionalProperties: { type: number }, description: Missing parameters take their defaults }
    MarketSelection:
      type: object
      required: [symbols, interval, start, end]
      additionalProperties: false
      properties:
        symbols: { type: array, minItems: 1, items: { type: string } }
        interval: { type: string }
        start: { type: string, format: date, description: First simulated day; earlier bars are used as history }
        end: { type: string, format: date }
    RunRequest:
      type: object
      required: [agents, market, initial_cash]
      additionalProperties: false
      properties:
        agents: { type: array, minItems: 1, items: { $ref: "#/components/schemas/AgentSpec" } }
        market: { $ref: "#/components/schemas/MarketSelection" }
        initial_cash: { type: number, exclusiveMinimum: 0, description: Per agent; every agent starts equal }
        cost_bps: { type: number, minimum: 0, default: 0, description: Basis points per side on traded notional; 0 when omitted }
    AgentRef:
      type: object
      required: [id, label]
      additionalProperties: false
      properties:
        id: { type: string, examples: [agt_1] }
        label: { type: string }
    RunCreated:
      type: object
      required: [id, status, created_at, agents]
      additionalProperties: false
      properties:
        id: { type: string, examples: [run_8f3a12bc] }
        status: { const: queued }
        created_at: { type: string, format: date-time }
        agents: { type: array, items: { $ref: "#/components/schemas/AgentRef" } }
    RunCreatedEnvelope:
      type: object
      required: [success, data, error, meta]
      properties:
        success: { const: true }
        data: { $ref: "#/components/schemas/RunCreated" }
        error: { type: "null" }
        meta: { type: "null" }
    Agent:
      type: object
      required: [id, label, strategy, parameters]
      additionalProperties: false
      properties:
        id: { type: string }
        label: { type: string }
        strategy: { type: string }
        parameters: { type: object, additionalProperties: { type: number } }
    Trade:
      type: object
      required: [timestamp, symbol, side, quantity, price]
      additionalProperties: false
      properties:
        timestamp: { type: string, format: date-time }
        symbol: { type: string }
        side: { enum: [buy, sell] }
        quantity: { type: number }
        price: { type: number }
    StepTrade:
      type: object
      required: [symbol, side, quantity, price]
      additionalProperties: false
      properties:
        symbol: { type: string }
        side: { enum: [buy, sell] }
        quantity: { type: number }
        price: { type: number }
    EquityPoint:
      type: object
      required: [timestamp, equity]
      additionalProperties: false
      properties:
        timestamp: { type: string, format: date-time }
        equity: { type: number }
    AgentResult:
      type: object
      required: [agent_id, final_equity, total_return, equity, trades]
      additionalProperties: false
      properties:
        agent_id: { type: string }
        final_equity: { type: number }
        total_return: { type: number }
        equity: { type: array, items: { $ref: "#/components/schemas/EquityPoint" } }
        trades: { type: array, items: { $ref: "#/components/schemas/Trade" } }
    Result:
      type: object
      required: [agents]
      additionalProperties: false
      properties:
        agents: { type: array, items: { $ref: "#/components/schemas/AgentResult" } }
    Progress:
      type: object
      required: [steps_done, steps_total]
      additionalProperties: false
      properties:
        steps_done: { type: integer, minimum: 0 }
        steps_total: { type: [integer, "null"] }
    Failure:
      type: object
      required: [message]
      additionalProperties: false
      properties:
        message: { type: string }
    Run:
      type: object
      required: [id, status, created_at, market, initial_cash, cost_bps, agents, progress, result, failure]
      additionalProperties: false
      properties:
        id: { type: string }
        status: { enum: [queued, running, completed, failed, cancelled] }
        created_at: { type: string, format: date-time }
        market: { $ref: "#/components/schemas/MarketSelection" }
        initial_cash: { type: number }
        cost_bps: { type: number }
        agents: { type: array, items: { $ref: "#/components/schemas/Agent" } }
        progress: { $ref: "#/components/schemas/Progress" }
        result: { oneOf: [{ $ref: "#/components/schemas/Result" }, { type: "null" }] }
        failure: { oneOf: [{ $ref: "#/components/schemas/Failure" }, { type: "null" }] }
    RunEnvelope:
      type: object
      required: [success, data, error, meta]
      properties:
        success: { const: true }
        data: { $ref: "#/components/schemas/Run" }
        error: { type: "null" }
        meta: { type: "null" }
    AgentSummary:
      type: object
      required: [agent_id, final_equity, total_return]
      additionalProperties: false
      properties:
        agent_id: { type: string }
        final_equity: { type: number }
        total_return: { type: number }
    ResultSummary:
      type: object
      required: [agents]
      additionalProperties: false
      properties:
        agents: { type: array, items: { $ref: "#/components/schemas/AgentSummary" } }
    RunSummary:
      description: A Run as listed by GET /v1/runs; the result keeps only final equity and return per agent.
      type: object
      required: [id, status, created_at, market, initial_cash, cost_bps, agents, progress, result, failure]
      additionalProperties: false
      properties:
        id: { type: string }
        status: { enum: [queued, running, completed, failed, cancelled] }
        created_at: { type: string, format: date-time }
        market: { $ref: "#/components/schemas/MarketSelection" }
        initial_cash: { type: number }
        cost_bps: { type: number }
        agents: { type: array, items: { $ref: "#/components/schemas/Agent" } }
        progress: { $ref: "#/components/schemas/Progress" }
        result: { oneOf: [{ $ref: "#/components/schemas/ResultSummary" }, { type: "null" }] }
        failure: { oneOf: [{ $ref: "#/components/schemas/Failure" }, { type: "null" }] }
    Page:
      type: object
      required: [total, page, limit]
      additionalProperties: false
      properties:
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        limit: { type: integer, minimum: 1 }
    RunListEnvelope:
      type: object
      required: [success, data, error, meta]
      properties:
        success: { const: true }
        data: { type: array, items: { $ref: "#/components/schemas/RunSummary" } }
        error: { type: "null" }
        meta: { $ref: "#/components/schemas/Page" }
    StepAgent:
      type: object
      required: [agent_id, equity, trades]
      additionalProperties: false
      properties:
        agent_id: { type: string }
        equity: { type: number }
        trades: { type: array, items: { $ref: "#/components/schemas/StepTrade" } }
    StepEvent:
      type: object
      required: [timestamp, agents]
      additionalProperties: false
      properties:
        timestamp: { type: string, format: date-time }
        agents: { type: array, items: { $ref: "#/components/schemas/StepAgent" } }
