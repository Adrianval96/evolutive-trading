[tool.ruff]
line-length = 150
target-version = "py312"
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "A", "C4", "SIM", "RET", "PT", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["engine.py", "service.py", "trader.py"]  # tests are linted by ruff, not type-checked

[[tool.mypy.overrides]]
module = ["pandas.*", "yaml", "jsonschema.*", "mockito.*", "model", "alpaca.*"]
ignore_missing_imports = true
